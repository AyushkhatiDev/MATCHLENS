name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[agentic,realtime,presentation,dev]'
      - run: python -m pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run typecheck
      - run: python -m scripts.phase7_evaluate
      - run: python -m scripts.phase7_licenses
      - run: python -m scripts.phase7_security
      - run: docker compose -f deploy/compose.yaml build
